[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-route"
description = "PolarRoute: Long-distance maritime polar route planning taking into account complex changing environmental conditions"
authors = [
    {name = "Autonomous Marine Operations Planning (AMOP) Team, AI Lab, British Antarctic Survey", email = "amop@bas.ac.uk"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">= 3.10"
classifiers = ["Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
keywords= ["Polar Science",
    "Marine Routing",
    "Marine Science",
    "Marine Operations"]
dynamic = ["version"]
dependencies = [
    "meshiphi",
    "dask",
    "geopandas",
    "jsonschema",
    "matplotlib",
    "netcdf4",
    "numpy>=1.21.6",
    "pandas>=1.3.5",
    "pyproj",
    "shapely",
    "scikit-learn",
    "scipy",
    "tqdm",
    "xarray",
    "fiona",
]

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.dynamic]
version = {attr = "polar_route.__version__"}

[project.urls]
Homepage = "https://www.bas.ac.uk/project/logist-ai-for-environmentally-aware-decision-support/"
Documentation = "https://bas-logist.github.io/PolarRoute/"
Repository = "https://github.com/bas-logist/PolarRoute"
Issues = "https://github.com/bas-logist/PolarRoute/issues"

[project.scripts]
add_vehicle = "polar_route.cli:add_vehicle_cli"
optimise_routes = "polar_route.cli:optimise_routes_cli"
calculate_route = "polar_route.cli:calculate_route_cli"
resimulate_vehicle = "polar_route.cli:resimulate_vehicle_cli"
extract_routes = "polar_route.cli:extract_routes_cli"

[tool.pytest.ini_options]
log_cli = true
log_format = "[%(asctime)s] %(levelname)s : %(message)s"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[dependency-groups]
dev = [
    "pre-commit",
]
docs = [
    "mkdocs",
    "mkdocs-autoapi",
    "mkdocs-include-markdown-plugin",
    "mkdocstrings[python]",
    "mkdocs-material",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
]
